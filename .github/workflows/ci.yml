name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      # The examples compile against the SDK just built, so one that misreads a field fails the build.
      - run: javac -Xlint:all -Werror -d target/examples -cp "target/classes:$(cat target/classpath.txt)" examples/*.java
